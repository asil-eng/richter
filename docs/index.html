<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Richter — demo</title>
<meta name="description" content="Richter measures the magnitude of risk in any codebase: blast radius, hidden coupling, rework hotspots.">
<meta property="og:title" content="Richter — measure the magnitude of risk in any codebase">
<meta property="og:image" content="demo-thumbnail.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0d0f'/%3E%3Cpath d='M2 17h7l3-9 4 17 3-12 2 4h9' fill='none' stroke='%23ff6a1a' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root { --bg: #060809; --panel: #13191d; --line: rgba(170, 196, 204, .19); --text: #e8eef0; --dim: #8f9ea6; --orange: #ff6a1a; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text); font: 15px/1.6 ui-monospace, "SF Mono", Menlo, monospace;
    background:
      repeating-linear-gradient(0deg, rgba(150,200,205,.06) 0 1px, transparent 1px 128px),
      repeating-linear-gradient(90deg, rgba(150,200,205,.06) 0 1px, transparent 1px 128px), var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 16px;
  }
  .wrap { width: min(1100px, 100%); }
  .kicker { color: var(--dim); letter-spacing: .16em; font-size: 12px; display: flex; gap: 12px; align-items: center; }
  .kicker::before { content: ''; width: 22px; height: 1px; background: var(--orange); }
  h1 { font: 800 clamp(40px, 7vw, 72px)/1 "Helvetica Neue", Arial, sans-serif; letter-spacing: -.01em; margin: 10px 0 6px; }
  h1 em { font-style: normal; color: var(--orange); }
  p { color: var(--dim); margin: 0 0 22px; }
  video { width: 100%; display: block; border: 1px solid var(--line); background: #000; box-shadow: 0 24px 80px rgba(0,0,0,.6); }
  .foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 14px; font-size: 13px; color: var(--dim); }
  a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--orange); }
</style>
</head>
<body>
  <main class="wrap">
    <div class="kicker">SEISMIC RISK ANALYSIS FOR CODE</div>
    <h1>RICHTER <em>demo</em></h1>
    <p>Measure the magnitude of risk in any codebase: blast radius, hidden coupling and rework hotspots.</p>
    <video src="richter-demo.mp4" poster="demo-thumbnail.jpg" controls playsinline preload="metadata"></video>
    <div class="foot">
      <span>94 seconds · narration is AI-generated (OpenAI TTS)</span>
      <a href="https://github.com/asil-eng/richter">github.com/asil-eng/richter →</a>
    </div>
  </main>
</body>
</html>
